<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 128">
  <!-- Original artwork drawn for this app — a small waving chibi figure for
       the Saturday/Sabbath easter egg. Not traced from any reference image. -->

  <!-- shadow -->
  <ellipse cx="50" cy="121" rx="20" ry="4" fill="#000000" opacity="0.08"/>

  <!-- robe -->
  <path d="M36 66
           Q30 78 28 100
           Q27 112 34 116
           L66 116
           Q73 112 72 100
           Q70 78 64 66
           Q57 72 50 72
           Q43 72 36 66 Z" fill="#FFFFFF" stroke="#E7E4DC" stroke-width="1.4"/>
  <!-- robe fold lines -->
  <path d="M42 84 Q40 98 42 110" fill="none" stroke="#E7E4DC" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M58 84 Q60 98 58 110" fill="none" stroke="#E7E4DC" stroke-width="1.4" stroke-linecap="round"/>

  <!-- sash -->
  <path d="M35 84 Q50 90 65 84 L65 88 Q50 94 35 88 Z" fill="#F2C14E"/>
  <circle cx="50" cy="87" r="3.2" fill="#E0A83A"/>

  <!-- sandals -->
  <path d="M35 114 Q34 119 39 120 L47 120 Q49 117 46 114 Z" fill="#8A5A34"/>
  <path d="M53 114 Q51 119 56 120 L64 120 Q66 117 63 114 Z" fill="#8A5A34"/>

  <!-- resting arm sleeve, tucked at the side -->
  <path d="M63 68 Q71 74 70 84 Q69 89 64 87 Q62 86 63 82 Q65 76 58 70 Z" fill="#FFFFFF" stroke="#E7E4DC" stroke-width="1.2"/>

  <!-- waving arm + hand, grouped so it can be animated together -->
  <g id="mascot-wave-arm">
    <path d="M34 68 Q22 62 16 48 Q14 43 18 41 Q22 40 24 45 Q28 56 38 62 Z" fill="#FFFFFF" stroke="#E7E4DC" stroke-width="1.2"/>
    <circle cx="16" cy="42" r="7.2" fill="#F6C89F"/>
    <path d="M11 37 Q10 33 12 32" stroke="#F6C89F" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M14.5 35 Q13.8 31 16 30" stroke="#F6C89F" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M18 34.5 Q18 30.5 20 30" stroke="#F6C89F" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- hair, behind face -->
  <path d="M28 40
           Q26 19 50 15
           Q74 19 72 40
           Q72 52 65 60
           Q68 46 62 37
           Q59 46 56 51
           Q56 42 50 40
           Q44 42 44 51
           Q41 46 38 37
           Q32 46 35 60
           Q28 52 28 40 Z" fill="#5B3A22"/>

  <!-- ears -->
  <circle cx="31" cy="41" r="2.6" fill="#FBD9BC"/>
  <circle cx="69" cy="41" r="2.6" fill="#FBD9BC"/>

  <!-- face -->
  <circle cx="50" cy="41" r="17" fill="#FBD9BC"/>

  <!-- beard, framing the jaw -->
  <path d="M34 43
           Q33 56 50 60
           Q67 56 66 43
           Q66 52 60 55
           Q62 47 59 42
           Q58 49 53 51
           Q54 45 50 44
           Q46 45 47 51
           Q42 49 41 42
           Q38 47 40 55
           Q34 52 34 43 Z" fill="#5B3A22"/>

  <!-- eyes -->
  <circle cx="43.5" cy="39" r="2" fill="#2A2118"/>
  <circle cx="56.5" cy="39" r="2" fill="#2A2118"/>

  <!-- brows -->
  <path d="M39.5 34 Q43.5 31.5 47.5 34" stroke="#5B3A22" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <path d="M52.5 34 Q56.5 31.5 60.5 34" stroke="#5B3A22" stroke-width="1.6" fill="none" stroke-linecap="round"/>

  <!-- blush -->
  <ellipse cx="38" cy="45.5" rx="3.2" ry="2" fill="#F3A0A0" opacity="0.55"/>
  <ellipse cx="62" cy="45.5" rx="3.2" ry="2" fill="#F3A0A0" opacity="0.55"/>

  <!-- mouth -->
  <path d="M46 46.5 Q50 50 54 46.5" stroke="#B3453F" stroke-width="1.8" fill="none" stroke-linecap="round"/>
</svg>
